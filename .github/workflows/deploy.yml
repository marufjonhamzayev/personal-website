name: Deploy

# main shoxiga har push bo'lganda musama.uz ga yuklanadi.
# workflow_dispatch — GitHub sahifasidan qo'lda ham ishga tushirish uchun.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Ikki deploy bir vaqtda ketib qolmasin.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVER_HOST: 204.168.136.33
  SERVER_USER: mh
  TARGET_DIR: /srv/musama

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v5

      - name: SSH kalitni tayyorlash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Serverning host kaliti oldindan yozib qo'yilgan — o'rtada birov
          # turib olishining oldini oladi (man-in-the-middle himoyasi).
          printf '%s\n' "$SERVER_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIeKyA8flLGo3/1Bb0HQ4wy9i2BbkgPWGNcRRD4aRCO8" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Fayllarni serverga yuborish
        run: |
          rsync -rlvz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'CLAUDE.md' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "$SERVER_USER@$SERVER_HOST:$TARGET_DIR/"

      - name: Tekshirish
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://musama.uz)
          echo "musama.uz javobi: $code"
          test "$code" = "200"
